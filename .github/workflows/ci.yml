name: CI

on:
  push:
    branches: [main]
  pull_request:

# PRD §15 defines eight CI jobs. They are split into three-in-one here:
# `quality` covers 1–5 and needs no database; `database` covers 6–7 and boots a
# local Supabase stack; `e2e` is job 8 — the axe accessibility scan over the
# public routes, which build plan §6 step 10 asked for and Phase 1 never ran.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned above the 20.19 floor that the toolchain requires. Keep in step
  # with .nvmrc and the `engines` field in package.json.
  NODE_VERSION: "22.13.0"

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # 1. Install with locked dependencies.
      - name: Install
        run: npm ci

      # 2. Format and lint.
      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # 3. Type-check. CI fails on any type error (PRD §20.3).
      - name: Type check
        run: npm run typecheck

      # 4. Unit tests.
      - name: Unit tests
        run: npm run test

      # 5. Build.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_APP_ENV: preview

  database:
    name: Migrations and RLS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # 6. Start local Supabase and apply every migration from scratch. This is
      #    what proves a migration can be applied to an empty database, which a
      #    `db push` against a long-lived dev project never proves.
      - name: Start Supabase
        run: supabase start

      - name: Apply migrations from scratch
        run: supabase db reset

      # 7. RLS and database integration tests (pgTAP).
      #    Skipped cleanly until the first suite lands in Phase 0 step 0.12.
      - name: RLS and integration tests
        run: |
          if compgen -G "supabase/tests/*.sql" > /dev/null; then
            supabase test db
          else
            echo "::warning::No pgTAP suites yet — RLS tests are a Phase 0 exit gate."
          fi

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  e2e:
    name: Accessibility scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      # playwright.config.ts uses channel "chrome" rather than the bundled
      # Chromium, so this installs Google Chrome specifically. See the comment
      # there for why.
      - name: Install Chrome
        run: npx playwright install --with-deps chrome

      # 8. Accessibility scan. The public pages read from Supabase — the course
      #    catalogue and centre finder are database-backed — so a placeholder
      #    URL would produce error pages and a scan of an error page that
      #    passes is worse than no scan. Rather than pretend, the job says
      #    plainly when it could not run.
      #
      #    To turn it on: add NEXT_PUBLIC_SUPABASE_URL and
      #    NEXT_PUBLIC_SUPABASE_ANON_KEY as repository secrets. Both are
      #    client-side values that ship in the browser bundle anyway; the
      #    service-role key is NOT needed here and must not be added.
      #
      #    E2E_PASSWORD is optional and extends the scan to the three portals,
      #    which is where most of the interface is. It is the password
      #    `npm run db:seed:dev` prints for its seeded logins. Without it the
      #    run covers the public routes only and says so.
      - name: Accessibility scan
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_APP_ENV: preview
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "::warning::Accessibility scan skipped — NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY are not set as repository secrets. The scan passes locally; it is not running here."
            exit 0
          fi
          npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
